name: Validate Fontaine domain scripts

on:
  push:
    paths:
      - 'Scripts/Scene/40770/**'
      - 'Scripts/Scene/40771/**'
      - 'Scripts/Scene/40772/**'
      - 'Scripts/Scene/40773/**'
      - 'scripts/validate_fontaine_weapon_domains.py'
      - '.github/workflows/validate-fontaine-domain-scripts.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Scripts/Scene/40770
            Scripts/Scene/40771
            Scripts/Scene/40772
            Scripts/Scene/40773
            scripts/validate_fontaine_weapon_domains.py
          sparse-checkout-cone-mode: false
      - name: Validate scene blocks, keys and wave configs
        run: python3 scripts/validate_fontaine_weapon_domains.py
