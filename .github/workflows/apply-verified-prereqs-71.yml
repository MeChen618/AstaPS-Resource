name: Apply verified 7.1 prerequisite manifest (one-shot)

on:
  push:
    branches: [fix/questexcel-verified-prereqs-71]
    paths: [.github/workflows/apply-verified-prereqs-71.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/questexcel-verified-prereqs-71
          filter: blob:none
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools
            ExcelBinOutput/QuestExcelConfigData.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply only strict evidence-backed manifest rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import fix_chapter1207_prerequisites as manifest
          import fix_liyue_prerequisites as base

          path = Path('ExcelBinOutput/QuestExcelConfigData.json')
          before = json.loads(path.read_text(encoding='utf-8'))
          assert isinstance(before, list) and len(before) == 33217
          assert len(base.REPAIRS) == len(set(r.sub_id for r in base.REPAIRS)) == 678

          before_rows = {int(x['subId']): x for x in before}
          assert len(before_rows) == len(before)
          assert base.patch_excel(path, check=False) == 0
          assert base.patch_excel(path, check=True) == 0

          after = json.loads(path.read_text(encoding='utf-8'))
          after_rows = {int(x['subId']): x for x in after}
          assert len(after_rows) == len(after) == 33217
          assert set(before_rows) == set(after_rows)
          modified = []
          for sub_id in before_rows:
              a, b = before_rows[sub_id], after_rows[sub_id]
              if a == b:
                  continue
              modified.append(sub_id)
              keys = {k for k in set(a) | set(b) if a.get(k) != b.get(k)}
              assert keys <= {'acceptCond', 'acceptCondComb'}, (sub_id, keys)
          assert modified, 'No repairs were needed; do not write a no-op commit'
          assert before_rows[35301].get('finishExec') == after_rows[35301].get('finishExec'), 'Amber trial grant regressed'
          print('REPAIRED_ROWS', len(modified))
          print('REPAIRED_IDS', sorted(modified))
          print('UNCHANGED_POPULATION', len(after))
          print('VERIFIED_MANIFEST', len(base.REPAIRS))
          PY

      - name: Run upstream incremental prerequisite regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_prerequisite_incremental.py

      - name: Commit checked data to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --quiet -- ExcelBinOutput/QuestExcelConfigData.json && {
            echo 'No content changes to commit.' >&2
            exit 1
          }
          git config user.name "Rino"
          git config user.email "71957726+RinoPaw@users.noreply.github.com"
          git add ExcelBinOutput/QuestExcelConfigData.json
          git commit -m "fix(resources): apply verified cumulative quest prerequisites [skip ci]"
          git push origin HEAD:fix/questexcel-verified-prereqs-71
